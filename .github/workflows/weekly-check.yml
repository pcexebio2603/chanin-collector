name: Chequeo semanal del colector

on:
  schedule:
    # Domingo 12:07 Lima (UTC-5), fuera de la ventana del colector.
    # GitHub atribuye los runs programados a quien PUSHEÓ el último cambio de este fichero
    # (no a quien firma el commit), y a esa cuenta le manda los correos de fallo. Si vuelven a
    # llegar a la cuenta equivocada: `gh auth switch` a la buena y tocar esta línea del cron.
    - cron: '7 17 * * 0'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Sin npm install: el chequeo solo usa d1-client.js (fetch nativo de Node 20).
      # La auditoría va PRIMERO y con `always()` más abajo no haría falta, pero así se ejecuta
      # aunque el chequeo acabe en WARN: interesa el número incluso —sobre todo— cuando algo va mal.
      - name: Auditoría del detector de ofertas
        run: node auditoria.js --dias 7
      - name: Chequeo semanal → D1
        run: node weekly-check-d1.js
