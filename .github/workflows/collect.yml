name: Colector Chanin → D1

on:
  schedule:
    - cron: '13 12,0 * * *' # 07:00 y 19:00 Lima (UTC-5); 2 corridas/día
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Prueba acotada: páginas por categoría (vacío = corrida completa)'
        required: false
        default: ''

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # < 6h (límite de job); una corrida completa ~190 min
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependencias
        run: npm install
      - name: Recolectar → D1
        run: |
          if [ -n "${{ github.event.inputs.max_pages }}" ]; then
            echo "== PRUEBA ACOTADA: plazavea, ${{ github.event.inputs.max_pages }} páginas/categoría =="
            node collect.js --retailer plazavea --max-pages ${{ github.event.inputs.max_pages }}
          else
            node collect.js
            node falabella/collect-falabella.js
          fi
      # CAZA PRECIO APAGADO (2026-09-06). El paso `node ofertas.js --ver` recalculaba la tabla
      # `ofertas` y costaba 30.6 MILLONES de filas leídas por corrida — dos corridas al día, 61M,
      # cuando el plan Free de D1 da 5M/día y Cloudflare empezó a APLICAR ese límite el 1-sep.
      # Resultado: se agotaba el cupo por la mañana y la API pública quedaba devolviendo 500 el
      # resto del día, o sea la extensión y chanin.pe caídos por alimentar el carrusel.
      #
      # Se apaga el carrusel para salvar la extensión, que es la apuesta. La tabla `ofertas` NO se
      # borra: conserva su último contenido y `reverificar` sigue retirando lo que deja de estar
      # comprable. Se reactiva cuando la referencia se calcule de forma INCREMENTAL (solo los
      # productos cuyo precio cambió, no un escaneo completo), que es del orden de 100k lecturas.
      # - name: Recalcular ofertas (Caza Precio)
      #   run: node ofertas.js --ver
