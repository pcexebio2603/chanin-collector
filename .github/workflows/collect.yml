name: Colector Chanin → D1

on:
  # PAUSADO 2026-07-25: la D1 llegó al tope de 500 MB del plan Free y el flush falla con
  # "Exceeded maximum DB size", perdiendo la corrida entera. Además, una corrida a mitad de
  # la migración de esquema dejaría el export inconsistente. RESTAURAR esta línea al terminar:
  #   - cron: '13 12,0 * * *' # 07:00 y 19:00 Lima (UTC-5); 2 corridas/día
  # schedule:
  #   - cron: '13 12,0 * * *'
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Prueba acotada: páginas por categoría (vacío = corrida completa)'
        required: false
        default: ''

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # < 6h (límite de job); una corrida completa ~190 min
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependencias
        run: npm install
      - name: Recolectar → D1
        run: |
          if [ -n "${{ github.event.inputs.max_pages }}" ]; then
            echo "== PRUEBA ACOTADA: plazavea, ${{ github.event.inputs.max_pages }} páginas/categoría =="
            node collect.js --target d1 --retailer plazavea --max-pages ${{ github.event.inputs.max_pages }}
          else
            node collect.js --target d1
            node falabella/collect-falabella.js --target d1
          fi
