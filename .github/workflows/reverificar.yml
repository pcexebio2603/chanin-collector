name: Reverificar ofertas

# La verificación que hace el colector es una foto del momento, pero el carrusel la muestra
# hasta 12 horas (el colector corre 2×/día). Medido el 2026-07-28: en apenas 3 horas, 1 de 105
# ofertas publicadas ya estaba agotada — un Huawei Watch que Pablo abrió desde la web.
#
# Esto NO recalcula candidatas: coge lo ya publicado y sólo comprueba que siga comprable y al
# mismo precio, retirando lo que no. Tarda ~15 s y son unas pocas centenas de peticiones.
on:
  schedule:
    # Cada 3 horas. GitHub atribuye los runs programados a quien PUSHEÓ el último cambio de este
    # fichero, y a esa cuenta le manda los correos de fallo.
    - cron: '40 */3 * * *'
  workflow_dispatch:

# Mismo grupo que el colector: si hay una corrida en marcha, esto espera. Si no, se pisarían —
# el paso final del colector reescribe la tabla entera.
concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  reverificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reverificar lo publicado
        run: node ofertas.js --reverificar
